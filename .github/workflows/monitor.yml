name: ARK Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ark-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ARK-Status prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          SERVER_LIST = "https://cdn2.arkdedicated.com/servers/asa/officialserverlist.json"
          TARGET = "EU-PVE-Astraeos5994"
          STATE = Path("state.json")

          req = urllib.request.Request(SERVER_LIST, headers={"User-Agent":"ARK-Monitor/1.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          servers = payload if isinstance(payload, list) else payload.get("servers", payload.get("Servers", []))
          if not isinstance(servers, list):
              raise RuntimeError("Unbekanntes Format der ASA-Serverliste")

          server = next((s for s in servers if str(s.get("Name","")).lower() == TARGET.lower()), None)
          new_status = "online" if server else "offline"

          try:
              old = json.loads(STATE.read_text(encoding="utf-8"))
          except Exception:
              old = {}

          old_status = old.get("status", "unknown")

          state = {
              "server": TARGET,
              "status": new_status,
              "checked_at": datetime.now(timezone.utc).isoformat(),
              "players": server.get("NumPlayers") if server else None,
              "max_players": server.get("MaxPlayers") if server else None,
              "map": server.get("MapName") if server else None,
              "ip": server.get("IP") if server else None,
              "port": server.get("Port") if server else None
          }
          STATE.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          topic = os.environ.get("NTFY_TOPIC","").strip()

          if topic and old_status not in ("unknown", new_status):
              if new_status == "offline":
                  title = "ARK Server OFFLINE"
                  message = f"🔴 {TARGET} ist offline."
                  tags = "rotating_light"
              else:
                  title = "ARK Server ONLINE"
                  extra = ""
                  if state["players"] is not None and state["max_players"] is not None:
                      extra = f" Spieler: {state['players']}/{state['max_players']}."
                  message = f"🟢 {TARGET} ist wieder online.{extra}"
                  tags = "white_check_mark"

              nreq = urllib.request.Request(
                  f"https://ntfy.sh/{topic}",
                  data=message.encode("utf-8"),
                  method="POST",
                  headers={"Title":title,"Priority":"5","Tags":tags}
              )
              with urllib.request.urlopen(nreq, timeout=20):
                  pass

          subprocess.run(["git","config","user.name","ARK Monitor"], check=True)
          subprocess.run(["git","config","user.email","41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git","add","state.json"], check=True)

          changed = subprocess.run(["git","diff","--cached","--quiet"]).returncode != 0
          if changed:
              subprocess.run(["git","commit","-m",f"ARK status check: {new_status}"], check=True)
              subprocess.run(["git","push"], check=True)

          print(f"{TARGET}: {new_status}")
          PY
