name: ARK Monitor

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ark-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ARK-Status prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |
          python3 - <<'PY'

          import json
          import os
          import random
          import subprocess
          import time
          import urllib.request

          from datetime import datetime, timezone
          from pathlib import Path


          SERVER_LIST = (
              "https://cdn2.arkdedicated.com/"
              "servers/asa/officialserverlist.json"
          )

          TARGET = "EU-PVE-Astraeos5994"

          STATE = Path("state.json")
          TEMP_STATE = Path("/tmp/ark_state.json")


          print("🦖 ARK Monitor startet...")
          print(f"Server: {TARGET}")


          # ==================================================
          # ALTEN STATUS LADEN
          # ==================================================

          try:
              old = json.loads(
                  STATE.read_text(
                      encoding="utf-8"
                  )
              )

          except Exception:
              old = {}


          old_status = old.get(
              "status",
              "unknown"
          )

          old_last_change_at = old.get(
              "last_change_at"
          )

          old_last_change_status = old.get(
              "last_change_status"
          )


          print(
              f"Vorheriger Status: "
              f"{old_status}"
          )


          # ==================================================
          # OFFIZIELLE ARK-LISTE MIT RETRIES LADEN
          # ==================================================

          def load_server_list():

              max_attempts = 6

              for attempt in range(
                  1,
                  max_attempts + 1
              ):

                  try:

                      print(
                          f"🌐 ARK-Liste laden "
                          f"(Versuch {attempt}/"
                          f"{max_attempts})..."
                      )

                      request = urllib.request.Request(
                          SERVER_LIST,
                          headers={
                              "User-Agent":
                                  "Mozilla/5.0 "
                                  "(ARK-Monitor/1.0)",

                              "Accept":
                                  "application/json,"
                                  "text/plain,*/*",

                              "Connection":
                                  "close"
                          }
                      )


                      with urllib.request.urlopen(
                          request,
                          timeout=45
                      ) as response:

                          data = json.load(
                              response
                          )


                      if isinstance(
                          data,
                          list
                      ):

                          print(
                              "✅ ARK-Liste "
                              "erfolgreich geladen."
                          )

                          return data


                      if isinstance(
                          data,
                          dict
                      ):

                          servers = data.get(
                              "servers",
                              data.get(
                                  "Servers",
                                  []
                              )
                          )

                          if isinstance(
                              servers,
                              list
                          ):

                              print(
                                  "✅ ARK-Liste "
                                  "erfolgreich geladen."
                              )

                              return servers


                      raise RuntimeError(
                          "Unbekanntes "
                          "Serverlistenformat"
                      )


                  except Exception as error:

                      print(
                          f"⚠️ Versuch "
                          f"{attempt} "
                          f"fehlgeschlagen:"
                      )

                      print(error)


                      if attempt < max_attempts:

                          delay = (
                              3
                              + attempt * 2
                              + random.random()
                          )

                          print(
                              f"⏳ Neuer Versuch "
                              f"in ca. "
                              f"{delay:.1f}s..."
                          )

                          time.sleep(delay)


              return None


          servers = load_server_list()


          # ==================================================
          # LISTE NICHT ERREICHBAR
          # ≠ SERVER OFFLINE
          # ==================================================

          if servers is None:

              print("")
              print(
                  "❌ Offizielle ARK-"
                  "Serverliste konnte "
                  "nicht geladen werden."
              )

              print(
                  "ℹ️ Status bleibt "
                  "unverändert."
              )

              print(
                  "ℹ️ Keine Offline-"
                  "Meldung wird gesendet."
              )

              raise SystemExit(1)


          print(
              f"Serverliste geladen: "
              f"{len(servers)} Einträge"
          )


          # ==================================================
          # SERVER SUCHEN
          # ==================================================

          server = next(

              (
                  item
                  for item
                  in servers

                  if str(
                      item.get(
                          "Name",
                          ""
                      )
                  ).lower()

                  == TARGET.lower()
              ),

              None
          )


          new_status = (
              "online"
              if server
              else "offline"
          )


          print(
              f"Aktueller Status: "
              f"{new_status}"
          )


          # ==================================================
          # LETZTE STATUSÄNDERUNG
          # ==================================================

          if (
              old_status != "unknown"
              and
              old_status != new_status
          ):

              last_change_at = (
                  datetime.now(
                      timezone.utc
                  ).isoformat()
              )

              last_change_status = (
                  new_status
              )

              print(
                  "🕐 Neue Statusänderung "
                  "wird gespeichert."
              )

          else:

              last_change_at = (
                  old_last_change_at
              )

              last_change_status = (
                  old_last_change_status
              )


          # ==================================================
          # NEUE STATUSDATEI
          # ==================================================

          state = {

              "server":
                  TARGET,

              "status":
                  new_status,

              "checked_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "players":
                  (
                      server.get(
                          "NumPlayers"
                      )
                      if server
                      else None
                  ),

              "max_players":
                  (
                      server.get(
                          "MaxPlayers"
                      )
                      if server
                      else None
                  ),

              "last_change_at":
                  last_change_at,

              "last_change_status":
                  last_change_status
          }


          TEMP_STATE.write_text(

              json.dumps(
                  state,
                  indent=2,
                  ensure_ascii=False
              )
              + "\n",

              encoding="utf-8"
          )


          # ==================================================
          # PUSH NUR BEI STATUSÄNDERUNG
          # ==================================================

          topic = os.environ.get(
              "NTFY_TOPIC",
              ""
          ).strip()


          if (
              topic
              and
              old_status != "unknown"
              and
              old_status != new_status
          ):

              print("")
              print(
                  "⚠️ STATUSÄNDERUNG"
              )

              print(
                  f"{old_status} "
                  f"→ "
                  f"{new_status}"
              )


              if new_status == "offline":

                  title = (
                      "ARK Server OFFLINE"
                  )

                  message = (
                      f"🔴 {TARGET} "
                      f"ist offline."
                  )

                  tags = (
                      "rotating_light"
                  )


              else:

                  title = (
                      "ARK Server ONLINE"
                  )

                  message = (
                      f"🟢 {TARGET} "
                      f"ist wieder online."
                  )


                  if (
                      state["players"]
                      is not None
                      and
                      state["max_players"]
                      is not None
                  ):

                      message += (

                          f"\n👥 Spieler: "

                          f"{state['players']}"
                          f"/"
                          f"{state['max_players']}"
                      )


                  tags = (
                      "white_check_mark"
                  )


              notification = (
                  urllib.request.Request(

                      f"https://ntfy.sh/"
                      f"{topic}",

                      data=message.encode(
                          "utf-8"
                      ),

                      method="POST",

                      headers={
                          "Title":
                              title,

                          "Priority":
                              "5",

                          "Tags":
                              tags
                      }
                  )
              )


              try:

                  with urllib.request.urlopen(
                      notification,
                      timeout=30
                  ):
                      pass

                  print(
                      "🔔 Push-Mitteilung "
                      "gesendet."
                  )


              except Exception as error:

                  print(
                      "⚠️ Push konnte "
                      "nicht gesendet "
                      "werden:"
                  )

                  print(error)


          elif old_status == "unknown":

              print(
                  "Erster Lauf – "
                  "keine Benachrichtigung."
              )


          else:

              print(
                  "Status unverändert – "
                  "keine Benachrichtigung."
              )


          # ==================================================
          # AKTUELLSTEN GITHUB-STAND HOLEN
          # ==================================================

          print(
              "📦 Aktualisiere Repository..."
          )


          subprocess.run(
              [
                  "git",
                  "fetch",
                  "origin",
                  "main"
              ],
              check=True
          )


          subprocess.run(
              [
                  "git",
                  "reset",
                  "--hard",
                  "origin/main"
              ],
              check=True
          )


          # ==================================================
          # NEUE STATE.JSON EINSETZEN
          # ==================================================

          STATE.write_text(

              TEMP_STATE.read_text(
                  encoding="utf-8"
              ),

              encoding="utf-8"
          )


          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "ARK Monitor"
              ],
              check=True
          )


          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "41898282+github-actions[bot]"
                  "@users.noreply.github.com"
              ],
              check=True
          )


          subprocess.run(
              [
                  "git",
                  "add",
                  "state.json"
              ],
              check=True
          )


          changed = (

              subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              ).returncode

              != 0
          )


          # ==================================================
          # COMMIT + PUSH
          # ==================================================

          if changed:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      f"ARK status check: "
                      f"{new_status}"
                  ],
                  check=True
              )


              subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      "main"
                  ],
                  check=True
              )


              print(
                  "✅ state.json "
                  "aktualisiert."
              )


          else:

              print(
                  "Keine Änderung "
                  "an state.json."
              )


          print("")
          print(
              "✅ ARK Monitor fertig."
          )

          PY
